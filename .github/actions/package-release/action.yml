name: Package release artifacts
description: Stage shared skills, package providers, and generate the offer testing guide.
inputs:
  version:
    description: Semantic-release version to embed in every package.
    required: true
  microsoft-oauth-reference-id:
    description: Microsoft OAuth configuration reference ID created for Scopture.
    required: true
  staging-dir:
    description: Temporary directory for the shared versioned skills.
    required: false
    default: .release-staging/skills
  output-dir:
    description: Directory in which to write release artifacts.
    required: false
    default: dist
outputs:
  openai-package-path:
    description: Path to the OpenAI plugin ZIP.
    value: ${{ steps.package-openai.outputs.package-path }}
  claude-package-path:
    description: Path to the Claude plugin ZIP.
    value: ${{ steps.package-claude.outputs.package-path }}
  microsoft-package-path:
    description: Path to the versioned Microsoft ZIP.
    value: ${{ steps.package-microsoft.outputs.package-path }}
  offer-testing-guide-path:
    description: Path to the provider-neutral offer testing guide PDF.
    value: ${{ steps.testing-guide.outputs.package-path }}
runs:
  using: composite
  steps:
    - name: Install PDF generator dependency
      shell: bash
      run: python3 -m pip install --disable-pip-version-check -r requirements-release.txt
    - name: Package shared skills
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        STAGING_DIR: ${{ inputs.staging-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        python3 scripts/package_skills.py \
          --version "$RELEASE_VERSION" \
          --staging-dir "$STAGING_DIR" \
          --out-dir "$OUTPUT_DIR"
    - id: package-openai
      uses: $/.github/actions/package-openai
      with:
        version: ${{ inputs.version }}
        skills-dir: ${{ inputs.staging-dir }}
        output-dir: ${{ inputs.output-dir }}
    - id: package-claude
      uses: $/.github/actions/package-claude
      with:
        version: ${{ inputs.version }}
        skills-dir: ${{ inputs.staging-dir }}
        output-dir: ${{ inputs.output-dir }}
    - id: package-microsoft
      uses: $/.github/actions/package-microsoft
      with:
        version: ${{ inputs.version }}
        oauth-reference-id: ${{ inputs.microsoft-oauth-reference-id }}
        skills-dir: ${{ inputs.staging-dir }}
        output-dir: ${{ inputs.output-dir }}
    - id: testing-guide
      name: Generate versioned offer testing guide
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        python3 scripts/generate_offer_testing_guide.py \
          --version "$RELEASE_VERSION" \
          --out-dir "$OUTPUT_DIR"
        echo "package-path=$OUTPUT_DIR/offer-testing-guide-scopture-${RELEASE_VERSION#v}.pdf" >> "$GITHUB_OUTPUT"
    - name: Write release checksums
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: python3 scripts/package_checksums.py --out-dir "$OUTPUT_DIR"
